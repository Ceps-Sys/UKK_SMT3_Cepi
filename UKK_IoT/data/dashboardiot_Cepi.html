<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Judul yang akan tampil di tab browser -->
    <title>IoT Dashboard</title>
    
    <!-- Memuat library Font Awesome untuk menampilkan ikon-ikon sensor dan UI -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* Mendefinisikan palet warna global untuk membentuk tema gelap (Dark Mode) ala Mazer */
        :root {
            --bg-color: #121421;        
            --card-bg: #1e1e2d;         
            --text-main: #ffffff;       
            --text-muted: #a1a5b7;      
            --accent-green: #4ade80;    
            --accent-green-glow: rgba(74, 222, 128, 0.2);
            --border-color: #2b2b40;
        }

        /* Mereset margin bawaan browser agar layout dashboard konsisten */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* Mengatur struktur utama layar menjadi dua kolom: sidebar kiri dan konten kanan */
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            min-height: 100vh;
        }

        /* Panel navigasi di sebelah kiri yang ukurannya dikunci tetap (fixed width) */
        .sidebar {
            width: 250px;
            background-color: var(--card-bg);
            border-right: 1px solid var(--border-color);
            padding: 20px;
            display: flex;
            flex-direction: column;
        }
        
        /* Area logo atau nama brand aplikasi di pojok kiri atas */
        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 40px;
            color: var(--text-main);
        }
        .brand i { color: var(--accent-green); }
        

        /* Area utama tempat semua kartu indikator sensor akan ditampilkan */
        .main-content {
            flex: 1;
            padding: 40px;
            overflow-y: auto;
        }
        
        /* Bagian judul halaman di atas kartu-kartu data */
        .header {
            margin-bottom: 30px;
        }
        .header h1 {
            font-size: 2rem;
            margin-bottom: 5px;
        }
        .header h1 span {
            color: var(--accent-green);
        }
        .header p {
            color: var(--text-muted);
        }

        /* Grid layout agar kartu sensor bisa berbaris dan otomatis responsif turun ke bawah jika layar sempit */
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }
        
        /* Kotak kontainer untuk membungkus data spesifik (seperti kartu khusus Suhu atau khusus Kelembapan) */
        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        
        /* Baris atas di dalam kartu yang berisi label nama parameter dan ikon */
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: var(--text-muted);
            font-size: 0.9rem;
            font-weight: 600;
            text-transform: uppercase;
        }
        
        /* Angka utama pembacaan sensor yang dicetak besar di tengah kartu */
        .card-value {
            font-size: 2.5rem;
            font-weight: bold;
        }
        
        /* Baris bawah kartu untuk informasi tambahan seperti waktu pembaruan terakhir atau status alat */
        .card-footer {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-top: auto;
        }

        /* Label visual berukuran kecil untuk menunjukkan status sistem secara cepat (misal: "Online" atau "Stable") */
        .status-badge {
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.75rem;
            background: rgba(255, 255, 255, 0.1);
        }
        
        /* Indikator khusus beraksen merah saat mikrokontroler belum terhubung atau error */
        .status-offline { color: #ff5b5b; display: flex; align-items: center; gap: 5px;}
        .status-offline::before {
            content: ''; display: inline-block; width: 8px; height: 8px;
            background-color: #ff5b5b; border-radius: 50%;
        }

        /* Penentuan warna spesifik untuk ikon agar mudah dibedakan (Merah untuk Suhu, Biru untuk Air/Kelembapan) */
        .icon-temp { color: #ff5b5b; }
        .icon-hum { color: #3b82f6; }
        .icon-dev { color: var(--accent-green); }
    </style>
</head>
<body>



    <!-- Kontainer utama tempat seluruh indikator pembacaan sensor ditampilkan -->
    <main class="main-content">
        <div class="header">
            <h1>Welcome to <span>Your IoT Dashboard</span></h1>
            <p>Simple monitoring with powerful insights</p>
        </div>

        <!-- Grid pembungkus agar kartu parameter berjajar rapi -->
        <div class="cards-grid">
            
            <!-- Kartu ini berfungsi memonitor dan menampilkan angka pembacaan suhu lingkungan -->
            <div class="card">
                <div class="card-header">
                    <span><i class="fa-solid fa-temperature-half icon-temp"></i> TEMPERATURE</span>
                    <i class="fa-solid fa-rotate-right" id="refresh-temp" style="cursor: pointer;"></i>
                </div>
                <!-- Menampilkan double dash karena menunggu koneksi alat fisik -->
                <div class="card-value" id="temp-value">--°C</div>
                <div class="card-footer">
                    <i class="fa-regular fa-clock"></i>
                    <span id="temp-status">Menunggu koneksi...</span>
                </div>
            </div>

            <!-- Kartu ini berfungsi memonitor persentase kelembapan udara -->
            <div class="card">
                <div class="card-header">
                    <span><i class="fa-solid fa-droplet icon-hum"></i> HUMIDITY</span>
                    <span class="status-badge">Waiting</span>
                </div>
                <!-- Menampilkan double dash karena menunggu koneksi alat fisik -->
                <div class="card-value" id="hum-value">--%</div>
                <div class="card-footer">
                    <i class="fa-solid fa-circle-info"></i>
                    <span>Ideal range: 40-70%</span>
                </div>
            </div>

            <!-- Kartu ini berfungsi sebagai heartbeat/ping untuk memastikan mikrokontroler (ESP32/ESP8266) tidak mati atau terputus -->
            <div class="card">
                <div class="card-header">
                    <span><i class="fa-solid fa-plug icon-dev"></i> DEVICE STATUS</span>
                    <!-- Status default adalah offline sampai data fetch berhasil -->
                    <span class="status-offline" id="device-state">Offline</span>
                </div>
                <div class="card-value" style="font-size: 1.8rem; margin-top: 10px;">ESP32</div>
                <div class="card-footer">
                    <i class="fa-solid fa-microchip"></i>
                    <span>Firmware: v1.0.0</span>
                </div>
            </div>
            
        </div>
    </main>

    <script>
        /* Fungsi ini bertugas memperbarui angka pada layar (UI) agar user selalu melihat hasil bacaan sensor yang paling baru */
        function updateDashboardUI(temperature, humidity) {
            document.getElementById('temp-value').innerText = temperature + '°C';
            document.getElementById('hum-value').innerText = humidity + '%';
            
            /* Mengambil cap waktu sistem saat ini untuk memberi tahu user kapan data terakhir kali masuk */
            const currentTime = new Date().toLocaleTimeString('id-ID');
            document.getElementById('temp-status').innerText = 'Updated: ' + currentTime;
            
            /* Menandakan secara visual bahwa komunikasi ke perangkat hardware berjalan lancar */
            const deviceState = document.getElementById('device-state');
            deviceState.innerText = 'Online';
            deviceState.className = 'status-online'; // Ganti kelas CSS jika ada untuk ikon bulat hijau
            deviceState.style.color = 'var(--accent-green)';
        }

        /* Fungsi ini bertugas memberikan notifikasi visual error (teks merah & status offline) jika dashboard gagal menghubungi alat fisik atau server PHP */
        function setConnectionError() {
            document.getElementById('temp-status').innerText = 'Connection Error / No Data';
            
            const deviceState = document.getElementById('device-state');
            deviceState.innerText = 'Offline';
            deviceState.className = 'status-offline'; // Ganti kelas CSS jika ada
            deviceState.style.color = '#ff5b5b'; 
        }

        /* Fungsi ini memicu request HTTP untuk "menarik" data JSON dari Endpoint, entah langsung dari IP Address ESP32 atau melalui file API (misal data.php) di server XAMPP */
        async function fetchIoTData() {
            try {
                /*
                 HAPUS KOMENTAR BARIS DI BAWAH JIKA SUDAH ADA ESP32 ATAU XAMPP
                 
                 const response = await fetch('http://ALAMAT_IP_ATAU_LOCAL/api_data.php');
                 if (!response.ok) throw new Error('Network response was not ok');
                 const data = await response.json();
                 
                 updateDashboardUI(data.suhu, data.kelembapan);
                 */
                 
                 // Karena belum disambungkan ke sensor, biarkan kosong tanpa pembaruan nilai acak
                 console.log("Menunggu koneksi sensor...");
                 // setConnectionError(); // Optional: panggil ini jika ingin langsung menampilkan pesan error saat data benar-benar gagal ditarik.

            } catch (error) {
                /* Jika alat IoT terputus jaringan atau server lokal down, jalankan mekanisme error handling UI */
                setConnectionError();
            }
        }

        /* Mengeksekusi penarikan data untuk pertama kalinya sesaat setelah halaman dashboard berhasil dimuat */
        fetchIoTData(); 
        
        /* Fitur Auto-Refresh: Timer ini memaksa browser menjalankan fungsi fetchIoTData secara berulang setiap 3000ms (3 detik) agar dashboard memantau data secara real-time saat sensor sudah siap */
        setInterval(fetchIoTData, 3000);
    </script>
</body>
</html>
